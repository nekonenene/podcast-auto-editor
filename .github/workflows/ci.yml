# Windows でのビルドとテストを検証する。
# macOS は開発環境そのもので検証されるため CI には含めない。
# 必要になったら matrix で macos-latest を足せば両対応に戻せる
name: CI

on:
  push:
    # windows_compatible はマージ前に CI を確認するための一時的な指定。
    # マージ後に外してよい
    branches: [main, windows_compatible]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # 統合テストに ffmpeg / ffprobe が必要。
      # このアクションは libx264 入りのビルドをキャッシュ付きで入れてくれる
      - uses: FedericoCarboni/setup-ffmpeg@v3

      - uses: actions/setup-node@v7
        with:
          # ローカルの開発環境に合わせる
          node-version: 26
          cache: npm
          cache-dependency-path: crates/pae-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # whisper.cpp の CMake 成果物や ONNX Runtime のダウンロードバイナリは
      # target/ 配下に置かれるため、このキャッシュで2回目以降が大幅に速くなる
      - uses: Swatinem/rust-cache@v2

      - name: npm ci
        working-directory: crates/pae-app
        run: npm ci

      # tsc の型チェックを兼ねる。
      # tauri::generate_context! が dist/ を埋め込むため clippy / test より先に実行する
      - name: フロントエンドのビルド
        working-directory: crates/pae-app
        run: npm run build

      - name: フォーマット確認
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      # モデルダウンロードが必要なテスト (--ignored) と CUDA ビルドは
      # ランナーに GPU が無くコストも高いため CI では実行しない
      - name: テスト
        run: cargo test --workspace
