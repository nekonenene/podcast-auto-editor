[workspace]
resolver = "2"
members = ["crates/pae-core", "crates/pae-cli", "crates/pae-app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# whisper.cpp のビルドを高速化しつつ、リリース相当の実行速度をデバッグビルドでも得る
[profile.dev.package."*"]
opt-level = 2
